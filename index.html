<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ENVOY 安捷國際旅行社 ｜ 臺灣原鄉慢旅 ✕ 歐洲風土鐵道巡遊</title>
  <meta name="description" content="ENVOY 安捷國際旅行社官方首頁。深耕臺灣八大原鄉部落慢旅與歐洲全景景觀鐵道漫遊，以深度、風土、永續帶領旅人探索在地生活。">

  <!-- Google Fonts: Montserrat & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #081B24;
      --bg-card: #0D2B38;
      --bg-card-hover: #143A4B;
      --accent-gold: #C5A059;
      --accent-red: #E11D48;
      --line-green: #06C755;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
    }

    /* ==================== 1. 頂部固定毛玻璃導覽列 ==================== */
    .netflix-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(8, 27, 36, 0.95) 0%, rgba(8, 27, 36, 0.7) 70%, transparent 100%);
      backdrop-filter: blur(14px);
      z-index: 1000;
      transition: background 0.3s ease;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 36px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #FFF;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1.5px;
      display: flex;
      flex-direction: column;
    }
    .brand-title span {
      font-size: 10px;
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-weight: 700;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }
    .nav-links a {
      color: #E2E8F0;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 700;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: var(--accent-gold); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-line-nav {
      background: var(--line-green);
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(6, 199, 85, 0.35);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .btn-line-nav:hover {
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    /* ==================== 2. Netflix 旗艦巨幅主視覺 (Hero Billboard) ==================== */
    .hero-billboard {
      position: relative;
      width: 100%;
      height: 82vh;
      min-height: 580px;
      display: flex;
      align-items: center;
      padding: 0 60px;
      background: radial-gradient(circle at 75% 35%, rgba(197, 160, 89, 0.18), transparent 50%),
                  linear-gradient(180deg, rgba(8, 27, 36, 0.2) 0%, rgba(8, 27, 36, 0.95) 90%, var(--bg-main) 100%),
                  url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
    }
    .hero-content {
      max-width: 650px;
      z-index: 10;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(225, 29, 72, 0.2);
      border: 1px solid var(--accent-red);
      color: #FDA4AF;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: 48px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hero-desc {
      font-size: 16px;
      line-height: 1.65;
      color: #CBD5E1;
      margin-bottom: 28px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-hero-primary {
      background: #FFFFFF;
      color: #081B24;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-hero-primary:hover { background: #E2E8F0; transform: translateY(-2px); }
    .btn-hero-secondary {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      padding: 12px 26px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-hero-secondary:hover { background: rgba(255, 255, 255, 0.28); transform: translateY(-2px); }

    /* ==================== 3. 核心探索 Tab 專區 (地圖 + 部落圖鑑 + 歐洲指南) ==================== */
    .interactive-hub-section {
      padding: 30px 40px 60px;
    }
    .section-header-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tab-nav-container {
      display: flex;
      gap: 12px;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 24px;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 17px;
      font-weight: 800;
      padding: 10px 22px;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
      font-family: inherit;
    }
    .tab-btn:hover { color: #FFF; }
    .tab-btn.active {
      color: #FFF;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -5.5px;
      left: 0;
      width: 100%;
      height: 3.5px;
      background: var(--accent-gold);
      border-radius: 4px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 地圖面板樣式（保留完整手繪地圖互動） */
    .map-frame-wrapper {
      position: relative;
      width: 100%;
      height: 720px;
      background: #BCE3EC;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    #map-svg { width: 100%; height: 100%; object-fit: contain; }
    #fx-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 500;
    }
    .map-live-tag {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(13, 43, 56, 0.92);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 22px;
      padding: 8px 18px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      z-index: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-pulse {
      width: 10px; height: 10px;
      background: var(--line-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--line-green);
      animation: pulse-dot 1.2s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    .interactive-card { cursor: pointer; transition: transform 0.15s ease; }
    .interactive-card:active { transform: scale(0.97); }

    /* 蒸汽火車白煙動畫 */
    @keyframes puff-smoke {
      0% { r: 4px; opacity: 0.95; transform: translateY(0) scale(0.8); }
      40% { r: 12px; opacity: 0.8; transform: translateY(-10px) translateX(-6px) scale(1.3); }
      100% { r: 22px; opacity: 0; transform: translateY(-24px) translateX(-16px) scale(2); }
    }
    .smoke-puff-1 { animation: puff-smoke 1.3s infinite ease-out; }
    .smoke-puff-2 { animation: puff-smoke 1.3s infinite ease-out 0.26s; }
    .smoke-puff-3 { animation: puff-smoke 1.3s infinite ease-out 0.52s; }

    /* Tab 2: 八大部落圖鑑網格 */
    .tribes-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .tribe-intro-card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s, background 0.2s;
    }
    .tribe-intro-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-4px);
    }
    .tribe-tag-chip {
      display: inline-block;
      font-size: 12px;
      font-weight: 900;
      color: var(--accent-gold);
      background: rgba(197, 160, 89, 0.15);
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .tribe-name-tw { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .tribe-name-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
    .tribe-highlight-desc { font-size: 14px; color: #CBD5E1; line-height: 1.5; margin-bottom: 16px; }
    .btn-tribe-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #93C5FD;
      text-decoration: none;
      cursor: pointer;
    }

    /* Tab 3: 歐洲慢旅指南 */
    .europe-showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    .europe-guide-card {
      background: var(--bg-card);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .europe-guide-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .europe-guide-body { padding: 22px; }

    /* ==================== 4. Netflix 卡片橫向滑動軌道 (Horizontal Rows) ==================== */
    .netflix-section {
      padding: 20px 40px 40px;
      position: relative;
    }
    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .row-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .row-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 8px;
    }

    /* 部落快選膠囊列 */
    .tribe-pill-filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .tribe-pill-filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill:hover, .filter-pill.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #081B24;
    }

    /* 滑動軌道容器 */
    .slider-relative-container {
      position: relative;
      width: 100%;
    }
    .cards-scroll-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 4px 20px;
      scrollbar-width: none;
    }
    .cards-scroll-track::-webkit-scrollbar { display: none; }

    /* Netflix 風格卡片 */
    .tour-card {
      flex: 0 0 290px;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      position: relative;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .tour-card:hover {
      transform: scale(1.04) translateY(-6px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      border-color: var(--accent-gold);
      z-index: 20;
    }
    .card-img-wrap {
      width: 100%;
      height: 165px;
      position: relative;
      overflow: hidden;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .tour-card:hover .card-img-wrap img { transform: scale(1.08); }
    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(8, 27, 36, 0.88);
      backdrop-filter: blur(6px);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 900;
      border: 1px solid rgba(197, 160, 89, 0.4);
    }
    .card-duration {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #FFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-info {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .card-footer-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-tag-pill {
      font-size: 11px;
      color: #6EE7B7;
      font-weight: 800;
    }
    .btn-detail-link {
      font-size: 13px;
      font-weight: 900;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 左右滑動按鈕 */
    .slider-arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(8, 27, 36, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #FFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 30;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.2s;
    }
    .slider-arrow-btn:hover {
      background: var(--accent-gold);
      color: #081B24;
      transform: translateY(-50%) scale(1.1);
    }
    .slider-arrow-btn.prev { left: -20px; }
    .slider-arrow-btn.next { right: -20px; }

    /* ==================== 5. 行程詳細介紹展示區 (Itinerary Detail Section) ==================== */
    .detail-section-wrap {
      padding: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(13, 43, 56, 0.4);
    }
    .detail-itinerary-card {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 30px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap:
